services:
  - type: web
    name: skyrelis-readiness-check
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: SHOW_CONCEPT_BANNER
        value: "false"
      - key: SCORECARD_URL
        value: https://skyrelis.com/agent-scorecard-ungated
      - key: BOOK_URL
        value: https://skyrelis.com/contact
    disk:
      name: check-data
      mountPath: /var/data
      sizeGB: 1
